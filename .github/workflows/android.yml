# Costruisce il pacchetto Android (.aab, ancora senza firma) sui server di GitHub
# e lo salva, insieme al registro della costruzione, nel ramo «android-build».
# Parte da solo quando cambia qualcosa nella cartella android/ del ramo «sorgenti».
name: Pacchetto Android

on:
  push:
    branches: [sorgenti]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  pacchetto:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Costruisce il pacchetto
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          gradle -p android --no-daemon --stacktrace :app:bundleRelease 2>&1 | tee build.log

      - name: Salva il risultato nel ramo android-build
        if: always()
        run: |
          mkdir out
          cp build.log out/ 2>/dev/null || echo "nessun registro" > out/build.log
          cp android/app/build/outputs/bundle/release/*.aab out/ 2>/dev/null || true
          cp android/app/build/outputs/mapping/release/mapping.txt out/ 2>/dev/null || true
          {
            echo "esito: ${{ steps.build.outcome }}"
            echo "commit: $GITHUB_SHA"
            echo "data: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            ls -l out
            sha256sum out/*.aab 2>/dev/null || true
          } > out/ESITO.txt
          cd out
          git init -q -b android-build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Pacchetto Android da $GITHUB_SHA (${{ steps.build.outcome }})"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" android-build

      - name: Segnala l'errore
        if: steps.build.outcome != 'success'
        run: exit 1
