<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="manifest" href="manifest-en.webmanifest"><meta name="theme-color" content="#4361ee"><meta name="description" content="A primary-school maths game, Grades 1 to 5."><link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Maths"></head><body><title>Maths at Play</title>
<style>:root {
  color-scheme: light;
  --bg: #f4f7fb; --ink: #23263b; --muted: #6b7088; --card: #ffffff; --line: #dfe5ef;
  --pri: #4361ee; --ok: #2a9d5c; --no: #e63946; --gold: #ffb703;
  --r: 18px; --shadow: 0 6px 18px rgba(30, 40, 90, .12);
  --font: "Nunito", "Segoe UI Rounded", "Arial Rounded MT Bold", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; font-family: var(--font); color: var(--ink); background: var(--bg); -webkit-tap-highlight-color: transparent; user-select: none; }
button { font: inherit; color: inherit; cursor: pointer; }
[hidden] { display: none !important; }
.app { min-height: 100%; display: flex; flex-direction: column; }
.top { display: flex; align-items: center; gap: 10px; padding: 10px 16px; background: var(--card); box-shadow: 0 1px 0 var(--line); position: sticky; top: 0; z-index: 5; }
.top .title { font-weight: 900; font-size: 20px; flex: 1; display: flex; align-items: center; gap: 8px; min-width: 0; }
.top .title span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip { display: inline-flex; align-items: center; gap: 6px; background: #fff7e0; border: 2px solid #ffe08a; padding: 4px 12px; border-radius: 999px; font-weight: 800; }
.icon-btn { border: 0; background: #eef2fb; border-radius: 12px; min-width: 44px; height: 44px; font-size: 20px; padding: 0 10px; font-weight: 800; }
.lang-btn { display: inline-grid; place-items: center; text-decoration: none; color: #1d3557; font-size: 15px; }
.inst-btn { font-size: 15px; background: #e8f7ee; color: #1f7a45; }
.icon-btn:hover { background: #e2e8f8; }
.screen { flex: 1; padding: 18px; max-width: 1100px; width: 100%; margin: 0 auto; }
h1 { font-size: 30px; margin: 6px 0 16px; text-align: center; }
h2 { font-size: 22px; margin: 18px 0 10px; }
.sub { text-align: center; color: var(--muted); margin: -8px 0 18px; font-size: 17px; }
.btn { border: 0; border-radius: 16px; padding: 14px 22px; font-size: 19px; font-weight: 800; background: var(--pri); color: #fff; box-shadow: 0 4px 0 #2f47b8; transition: transform .08s; }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #2f47b8; }
.btn.alt { background: #fff; color: var(--ink); box-shadow: 0 4px 0 #c7cfdf; border: 2px solid var(--line); }
.btn.ok { background: var(--ok); box-shadow: 0 4px 0 #1d6f40; }
.btn:disabled { opacity: .45; }
.row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }

/* profili */
.players { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
.player { background: var(--card); border: 3px solid transparent; border-radius: var(--r); padding: 16px 8px; text-align: center; box-shadow: var(--shadow); position: relative; }
.player:hover { border-color: var(--pri); }
.player .av { font-size: 54px; line-height: 1.1; }
.player .nm { font-weight: 900; font-size: 19px; margin-top: 4px; }
.player .st { color: var(--muted); font-size: 14px; margin-top: 2px; }
.player .del { position: absolute; top: 6px; right: 6px; border: 0; background: transparent; font-size: 16px; opacity: .5; }
.player.new { border: 3px dashed #b6c2dc; box-shadow: none; background: transparent; }
.avatars { display: grid; grid-template-columns: repeat(auto-fill, minmax(58px, 1fr)); gap: 8px; margin: 10px 0 16px; }
.avatars button { font-size: 36px; background: #fff; border: 3px solid var(--line); border-radius: 14px; padding: 6px 0; }
.avatars button[aria-pressed="true"] { border-color: var(--pri); background: #eef2ff; }
.field { width: 100%; font-size: 22px; padding: 12px 14px; border: 3px solid var(--line); border-radius: 14px; font-family: inherit; font-weight: 800; }
.field:focus { outline: none; border-color: var(--pri); }

/* mondi */
.worlds { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 16px; }
.world { border: 0; border-radius: 22px; padding: 18px 14px 16px; color: #fff; text-align: left; box-shadow: var(--shadow); position: relative; overflow: hidden; min-height: 170px; display: flex; flex-direction: column; }
.world .num { font-size: 15px; font-weight: 900; opacity: .9; text-transform: uppercase; letter-spacing: .06em; }
.world .wn { font-size: 22px; font-weight: 900; line-height: 1.15; margin: 6px 0 10px; }
.world .em { position: absolute; right: 10px; bottom: 4px; font-size: 64px; opacity: .9; }
.world .prog { margin-top: auto; font-weight: 800; background: rgba(0,0,0,.18); align-self: flex-start; padding: 3px 10px; border-radius: 999px; }
.t-prato { background: linear-gradient(140deg, #52b788, #2d6a4f); }
.t-bosco { background: linear-gradient(140deg, #6a994e, #386641); }
.t-mare { background: linear-gradient(140deg, #4cc9f0, #3a56d4); }
.t-montagna { background: linear-gradient(140deg, #9d8189, #5e548e); }
.t-spazio { background: linear-gradient(140deg, #3c096c, #10002b); }

/* moduli e livelli (mappa a sentiero) */
.module { background: var(--card); border-radius: 22px; padding: 14px 16px 18px; margin-bottom: 16px; box-shadow: var(--shadow); }
.module h2 { margin: 2px 0 10px; display: flex; align-items: center; gap: 10px; }
.module h2 .ms { margin-left: auto; font-size: 15px; color: var(--muted); font-weight: 800; }
.path { display: flex; flex-wrap: wrap; gap: 14px 10px; align-items: flex-start; }
.lvl { width: 128px; border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 4px; border-radius: 16px; }
.lvl .dot { width: 70px; height: 70px; border-radius: 50%; display: grid; place-items: center; font-size: 26px; font-weight: 900; color: #fff; background: var(--pri); box-shadow: 0 5px 0 rgba(0,0,0,.18); position: relative; }
.lvl.done .dot { background: var(--ok); }
.lvl.locked .dot { background: #b8c0d0; }
.lvl.locked { cursor: not-allowed; }
.lvl .lt { font-size: 14px; font-weight: 800; text-align: center; line-height: 1.2; }
.lvl .stars { font-size: 17px; letter-spacing: 1px; color: #d0d5df; height: 20px; }
.lvl .stars b { color: var(--gold); font-weight: 400; }
.lvl:not(.locked):hover .dot { transform: scale(1.06); }

/* livello */
.intro { background: var(--card); border-radius: 22px; padding: 22px; box-shadow: var(--shadow); max-width: 760px; margin: 0 auto; }
.intro .how { background: #fff8e1; border-left: 6px solid var(--gold); border-radius: 12px; padding: 14px 16px; font-size: 19px; line-height: 1.5; margin: 12px 0 18px; }
.game { max-width: 860px; margin: 0 auto; }
.progress { display: flex; gap: 6px; margin: 4px 0 14px; }
.progress i { flex: 1; height: 12px; border-radius: 6px; background: #dde3ee; }
.progress i.ok { background: var(--ok); }
.progress i.no { background: var(--no); }
.progress i.cur { background: var(--pri); }
.qcard { background: var(--card); border-radius: 24px; padding: 20px; box-shadow: var(--shadow); text-align: center; position: relative; }
.qtext { font-size: 26px; font-weight: 800; line-height: 1.35; margin: 4px 0 12px; }
.qvis { display: flex; justify-content: center; margin: 6px 0 12px; overflow-x: auto; }
.qvis svg { max-width: 100%; height: auto; font-family: var(--font); }
.mg-title { font-size: 15px; font-weight: 900; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }

/* minigioco palloncini */
.balloons { display: flex; flex-wrap: wrap; justify-content: center; gap: 18px; padding: 10px 0 4px; }
.balloon { border: 0; background: none; padding: 0; display: flex; flex-direction: column; align-items: center; animation: bob 2.6s ease-in-out infinite; }
.balloon:nth-child(2) { animation-delay: -.7s; } .balloon:nth-child(3) { animation-delay: -1.3s; } .balloon:nth-child(4) { animation-delay: -1.9s; }
.balloon .b { min-width: 118px; min-height: 118px; max-width: 220px; padding: 14px; border-radius: 50% 50% 48% 48%; display: grid; place-items: center; font-size: 22px; font-weight: 900; color: #fff; text-shadow: 0 2px 2px rgba(0,0,0,.25); box-shadow: inset -10px -12px 0 rgba(0,0,0,.12); line-height: 1.15; }
.balloon .s { width: 2px; height: 38px; background: #9aa3b5; }
.balloon.pop { animation: pop .35s forwards; }
.balloon.good .b { outline: 5px solid var(--ok); }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
@keyframes pop { to { transform: scale(1.5); opacity: 0; } }

/* coccodrillo */
.crocs { display: flex; justify-content: center; gap: 16px; margin-top: 8px; flex-wrap: wrap; }
.croc { border: 0; width: 120px; height: 120px; border-radius: 26px; background: #2a9d5c; color: #fff; font-size: 64px; font-weight: 900; box-shadow: 0 6px 0 #1d6f40; display: grid; place-items: center; }
.croc small { font-size: 13px; display: block; margin-top: -10px; }
.croc:active { transform: translateY(4px); box-shadow: 0 2px 0 #1d6f40; }

/* forziere con tastierino */
.chest { display: flex; flex-direction: column; align-items: center; gap: 12px; }
.answer-row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; align-items: flex-end; }
.ansbox { min-width: 150px; min-height: 64px; border: 4px solid #c7cfdf; border-radius: 16px; font-size: 34px; font-weight: 900; display: flex; align-items: center; justify-content: center; padding: 0 14px; background: #fff; }
.ansbox.focus { border-color: var(--pri); box-shadow: 0 0 0 4px #dfe6ff; }
.ansbox.ok { border-color: var(--ok); background: #e9f8ef; }
.ansbox.no { border-color: var(--no); background: #fdecee; }
.anslbl { font-size: 14px; font-weight: 800; color: var(--muted); text-align: center; margin-bottom: 4px; }
.frac { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.frac .bar { width: 120px; height: 5px; background: var(--ink); border-radius: 3px; }
.keypad { display: grid; grid-template-columns: repeat(3, 76px); gap: 10px; }
.keypad button { height: 64px; border: 0; border-radius: 16px; font-size: 30px; font-weight: 900; background: #eef2fb; box-shadow: 0 4px 0 #c9d2e6; }
.keypad button:active { transform: translateY(3px); box-shadow: 0 1px 0 #c9d2e6; }
.keypad .k-ok { background: var(--ok); color: #fff; box-shadow: 0 4px 0 #1d6f40; font-size: 24px; }
.keypad .k-del { background: #ffe3e3; box-shadow: 0 4px 0 #f1b0b0; }
.unit { font-size: 22px; font-weight: 800; color: var(--muted); align-self: center; }

/* spiegazione dopo l'errore */
.feedback { margin-top: 16px; border-radius: 20px; padding: 16px 18px; text-align: left; font-size: 19px; line-height: 1.45; animation: rise .25s ease-out; }
.feedback.ok { background: #e9f8ef; border: 3px solid #9bdcb5; }
.feedback.no { background: #fff4e6; border: 3px solid #ffc98a; }
.feedback .fh { font-weight: 900; font-size: 22px; margin-bottom: 6px; }
.feedback .ans { display: inline-block; background: #fff; border-radius: 10px; padding: 2px 10px; font-weight: 900; border: 2px solid var(--line); }
.feedback .how { margin-top: 8px; color: #5b4a2e; font-size: 16px; }
.feedback .row { justify-content: flex-start; margin-top: 12px; }
@keyframes rise { from { transform: translateY(10px); opacity: 0; } }

/* risultato */
.result { text-align: center; background: var(--card); border-radius: 24px; padding: 26px; box-shadow: var(--shadow); max-width: 560px; margin: 20px auto; }
.bigstars { font-size: 64px; letter-spacing: 6px; color: #d7dce6; }
.bigstars b { color: var(--gold); font-weight: 400; display: inline-block; animation: star .5s backwards; }
.bigstars b:nth-child(2) { animation-delay: .25s; } .bigstars b:nth-child(3) { animation-delay: .5s; }
@keyframes star { from { transform: scale(0) rotate(-90deg); } }
.confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 50; }
.confetti i { position: absolute; top: -20px; width: 10px; height: 16px; border-radius: 3px; animation: fall 2.2s linear forwards; }
@keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }

.modal { position: fixed; inset: 0; background: rgba(20, 25, 50, .45); display: grid; place-items: center; z-index: 40; padding: 16px; }
.modal .box { background: #fff; border-radius: 22px; padding: 22px; max-width: 520px; width: 100%; box-shadow: var(--shadow); }
.toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 12px; font-weight: 700; z-index: 60; }
.note { color: var(--muted); font-size: 15px; text-align: center; }

@media (max-width: 640px) {
  .qtext { font-size: 21px; }
  .keypad { grid-template-columns: repeat(3, 64px); }
  .keypad button { height: 56px; font-size: 26px; }
  .balloon .b { min-width: 96px; min-height: 96px; font-size: 18px; }
  .croc { width: 96px; height: 96px; font-size: 52px; }
  .screen { padding: 12px; }
}
@media (prefers-reduced-motion: reduce) { .balloon { animation: none; } .confetti { display: none; } }
@media print { .top { display: none; } }

/* «Lo sai che…?» */
.fact { display: flex; gap: 14px; align-items: flex-start; text-align: left; background: linear-gradient(135deg, #eef4ff, #f6efff); border: 3px solid #c9d6ff; border-radius: 20px; padding: 14px 16px; margin: 16px 0 18px; animation: rise .4s ease-out .3s backwards; }
.fact .fi { font-size: 42px; line-height: 1; flex: none; width: 52px; text-align: center; }
.fact .ft { font-weight: 900; font-size: 20px; color: #3a0ca3; margin-bottom: 4px; }
.fact .fx { font-size: 18px; line-height: 1.45; }

/* verifica finale */
.lvl.verif .dot { background: linear-gradient(135deg, #ffb703, #fb8500); font-size: 32px; }
.lvl.verif.locked .dot { background: #b8c0d0; }
.lvl .vg { font-size: 13px; font-weight: 900; color: #2a9d5c; height: 20px; }
.giudizio { display: inline-block; color: #fff; font-weight: 900; font-size: 22px; padding: 8px 18px; border-radius: 999px; margin: 4px 0 10px; }
.review { text-align: left; margin-top: 10px; }
.rv { border: 2px solid #ffd8a8; background: #fff9f0; border-radius: 16px; padding: 12px 14px; margin-bottom: 10px; font-size: 17px; line-height: 1.45; }
.rv-l { font-size: 13px; font-weight: 900; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.rv-q { font-size: 20px; font-weight: 800; margin: 4px 0; }
.rv .how { margin-top: 6px; color: #5b4a2e; font-size: 15px; }
.ans.no { border-color: #f5a3aa; background: #fdecee; text-decoration: line-through; }
.result .ans { display: inline-block; background: #fff; border-radius: 10px; padding: 1px 9px; font-weight: 900; border: 2px solid var(--line); }

/* minigioco: pesci che nuotano */
.mg-pesci { flex-direction: column; align-items: stretch; gap: 10px; background: linear-gradient(#cdefff, #8fd3f4); border-radius: 20px; padding: 14px; }
.mg-pesci .balloon { animation: swim 5s ease-in-out infinite alternate; align-self: flex-start; }
.mg-pesci .balloon:nth-child(2) { animation-duration: 6s; } .mg-pesci .balloon:nth-child(3) { animation-duration: 4.4s; } .mg-pesci .balloon:nth-child(4) { animation-duration: 5.6s; }
.mg-pesci .b { min-width: 150px; min-height: 64px; max-width: none; border-radius: 50% 40% 40% 50% / 50%; position: relative; padding: 10px 40px 10px 22px; }
.mg-pesci .b::after { content: ''; position: absolute; right: -24px; top: 50%; transform: translateY(-50%); border-left: 30px solid currentColor; border-top: 20px solid transparent; border-bottom: 20px solid transparent; color: inherit; }
.mg-pesci .b::before { content: ''; position: absolute; left: 16px; top: 14px; width: 8px; height: 8px; border-radius: 50%; background: #222; }
@keyframes swim { from { transform: translateX(0); } to { transform: translateX(min(42vw, 360px)); } }
/* minigioco: carte da girare */
.mg-carte { gap: 14px; }
.mg-carte .balloon { animation: none; perspective: 600px; }
.mg-carte .b { border-radius: 16px; min-width: 120px; min-height: 150px; box-shadow: 0 6px 0 rgba(0,0,0,.18); border: 4px solid #fff; transition: transform .35s; }
.mg-carte .balloon:hover .b { transform: translateY(-4px) rotate(-1deg); }
.mg-carte .balloon.flip .b { transform: rotateY(180deg) scale(.9); opacity: .4; }
.mg-carte .balloon.good .b { outline: 5px solid var(--ok); opacity: 1; transform: none; }

/* cifre colorate per posizione */
.nm { font-variant-numeric: tabular-nums; white-space: nowrap; }
.d-u { color: #1d6fe0; } .d-da { color: #e63946; } .d-h { color: #2a9d5c; } .d-k { color: #8338ec; } .d-mi { color: #f77f00; } .d-g { color: #6d4c41; } .d-dec { color: #0096a8; }
.nm [class^="d-"] { font-weight: 900; }
.sep-k { color: #4a4f63; font-weight: 900; font-size: .95em; margin: 0 .16em; }
.sep-dec { color: #111; font-weight: 900; font-size: 1.25em; margin: 0 .06em; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; justify-content: center; margin: -4px 0 10px; font-size: 14px; font-weight: 800; color: var(--muted); }
.legend .lg { display: inline-flex; align-items: center; gap: 4px; }
.legend i { font-style: normal; font-size: 16px; }
.balloon .lab { background: #fff; border-radius: 12px; padding: 2px 10px; text-shadow: none; color: var(--ink); box-shadow: 0 1px 0 rgba(0,0,0,.15); }
.ansbox .nm { font-size: 1em; }

/* calcolo passo per passo */
.steps { --cw: 38px; margin-top: 14px; background: #fff; border: 3px solid #c9d6ff; border-radius: 18px; padding: 12px; text-align: center; }
.stitle { font-weight: 900; color: #3a0ca3; margin-bottom: 8px; }
.swrap { overflow-x: auto; display: flex; justify-content: center; padding: 4px; }
.sgrid { --rh: 42px; display: grid; grid-auto-rows: var(--rh); font-size: 28px; font-weight: 900; font-variant-numeric: tabular-nums; }
.sc { display: grid; place-items: center; color: #1d3557; position: relative; }
.sc.d-u { color: #1d6fe0; } .sc.d-da { color: #e63946; } .sc.d-h { color: #2a9d5c; } .sc.d-k { color: #8338ec; } .sc.d-mi { color: #f77f00; } .sc.d-g { color: #6d4c41; } .sc.d-dec { color: #0096a8; } .sc.pad { color: #9aa3b5; }
.sc.ctop { font-size: 17px; align-items: end; color: #e63946; }
.sc.carry { color: #e63946; font-size: 17px; }
.sc.borrow { color: #d00000; font-size: 17px; }
.sc.struck::after { content: ''; position: absolute; left: 18%; right: 18%; top: 50%; border-top: 3px solid #d00000; transform: rotate(-20deg); }
.sc.line { border-top: 3px solid #1d3557; }
.sc.hl { background: #fff3bf; border-radius: 6px; }
.sc.op { color: #e63946; }
.sc.pad { color: #9aa3b5; }
.sc.res { animation: pop-in .3s ease-out; }
.sc.comma, .sc.commaR::after { color: #111; }
.sc.commaR::after { content: ','; position: absolute; right: -6px; bottom: 4px; }
.sc.dotR::after { content: '.'; position: absolute; right: -5px; bottom: 2px; color: #111; }
.sc.ul { border-bottom: 3px solid #1d3557; }
.sc.vbar { border-left: 3px solid #1d3557; }
.sc.hbar { border-bottom: 3px solid #1d3557; }
.sc.q { color: #2a9d5c; }
.sc.rem { color: #1d6fe0; }
.sc.down { color: #8338ec; }
.sc.dvs { color: #e76f51; }
@keyframes pop-in { from { transform: scale(1.6); opacity: 0; } }
.qcol { --cw: 38px; display: flex; justify-content: center; margin: 4px auto 12px; padding: 8px 14px; background: #fffdf3; border: 2px dashed #f2c94c; border-radius: 16px; width: fit-content; max-width: 100%; }
.handnote { max-width: 520px; margin: -4px auto 12px; text-align: center; font-size: 15px; font-weight: 700; color: #6b4f00; background: #fff6d6; border-radius: 12px; padding: 7px 12px; }
.guide { max-width: 860px; margin: 0 auto; background: var(--card); border-radius: 24px; padding: 22px 24px; box-shadow: 0 6px 24px rgba(30, 40, 90, .08); }
.guide h1 { text-align: center; margin: 4px 0 8px; }
.g-em { text-align: center; font-size: 54px; line-height: 1; }
.g-intro { font-size: 19px; line-height: 1.55; text-align: center; margin: 6px auto 4px; max-width: 700px; }
.g-mod { background: #f6f8ff; border-radius: 16px; padding: 14px 16px; margin: 14px 0; }
.g-mod h2 { display: flex; gap: 8px; align-items: center; margin: 0 0 6px; font-size: 21px; }
.g-learn { margin: 0 0 10px; font-size: 17px; line-height: 1.45; }
.g-terms { display: grid; grid-template-columns: minmax(130px, 220px) 1fr; gap: 8px 14px; margin: 0; }
.g-terms dt { font-weight: 900; color: #3a0ca3; }
.g-terms dd { margin: 0; font-size: 16px; line-height: 1.45; }
@media (max-width: 640px) { .g-terms { grid-template-columns: 1fr; gap: 2px; } .g-terms dd { margin-bottom: 8px; } .guide { padding: 16px 14px; } }
.coin { display: inline-block; width: 1.05em; height: 1.05em; border-radius: 50%; vertical-align: -0.16em; background: radial-gradient(circle at 35% 35%, #ffe680, #f5b800 55%, #c98a00); box-shadow: inset 0 0 0 2px #b07800; margin: 0 .12em; }
.stag { display: inline-block; background: #3a0ca3; color: #fff; font-size: 13px; font-weight: 800; border-radius: 999px; padding: 1px 9px; margin-right: 4px; vertical-align: 2px; }
.snote { font-size: 18px; line-height: 1.45; margin: 10px 4px; min-height: 52px; text-align: left; background: #f6f8ff; border-radius: 12px; padding: 10px 12px; }
.sctl { display: flex; gap: 10px; align-items: center; justify-content: center; flex-wrap: wrap; }
.sbtn { padding: 10px 16px; font-size: 16px; }
.scnt { font-weight: 800; color: var(--muted); }
.steps-holder { margin-top: 10px; }
@media (max-width: 640px) { .steps, .qcol { --cw: 30px; } .sgrid { font-size: 22px; --rh: 34px; } }

<script>window.LANG = 'en';
window.PWA = true;
/* Disegni SVG per gli esercizi: oggetti da contare, blocchi in base 10, linea dei numeri,
   orologio, monete, frazioni, figure, grafici. Tutti restituiscono una stringa SVG. */
(function (root) {
  'use strict';
  const V = {};
  const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
  const svg = (w, h, body, extra = '') => `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" class="vis" ${extra} xmlns="http://www.w3.org/2000/svg">${body}</svg>`;
  V.svg = svg;
  const T = (x, y, s, size = 16, fill = '#2b2d42', anchor = 'middle', weight = 600) => `<text x="${x}" y="${y}" font-size="${size}" fill="${fill}" text-anchor="${anchor}" font-weight="${weight}" font-family="inherit">${esc(s)}</text>`;
  V.T = T;
  const ICONS = {
    mela: (x, y, r) => `<circle cx="${x}" cy="${y + 1}" r="${r}" fill="#e63946"/><path d="M${x} ${y - r + 2} q2 -6 6 -7" stroke="#6b4226" stroke-width="2" fill="none"/><ellipse cx="${x + 5}" cy="${y - r}" rx="4" ry="2" fill="#52b788"/>`,
    stella: (x, y, r) => { let p = ''; for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.45 : r; p += (i ? 'L' : 'M') + (x + rr * Math.cos(a)).toFixed(1) + ' ' + (y + rr * Math.sin(a)).toFixed(1); } return `<path d="${p}Z" fill="#ffb703" stroke="#e09f00"/>`; },
    pallina: (x, y, r) => `<circle cx="${x}" cy="${y}" r="${r}" fill="#4895ef"/><circle cx="${x - r / 3}" cy="${y - r / 3}" r="${r / 4}" fill="#fff" opacity=".6"/>`,
    fiore: (x, y, r) => { let s = ''; for (let i = 0; i < 5; i++) { const a = i * 2 * Math.PI / 5; s += `<circle cx="${x + r * 0.55 * Math.cos(a)}" cy="${y + r * 0.55 * Math.sin(a)}" r="${r * 0.45}" fill="#f28482"/>`; } return s + `<circle cx="${x}" cy="${y}" r="${r * 0.35}" fill="#ffd166"/>`; },
    pesce: (x, y, r) => `<ellipse cx="${x}" cy="${y}" rx="${r}" ry="${r * 0.6}" fill="#f4a261"/><path d="M${x + r - 2} ${y} l${r * 0.7} ${-r * 0.5} v${r} Z" fill="#e76f51"/><circle cx="${x - r * 0.45}" cy="${y - 2}" r="2" fill="#222"/>`,
  };
  V.ICONS = Object.keys(ICONS);
  // n oggetti uguali, a righe da 5 (come nelle cornici del dieci)
  V.objects = function (n, kind = 'mela', perRow = 5) {
    const r = 13, gap = 34, rows = Math.max(1, Math.ceil(n / perRow));
    const w = Math.max(1, Math.min(n, perRow)) * gap + 10, h = rows * gap + 6;
    let b = '';
    for (let i = 0; i < n; i++) { const cx = 22 + (i % perRow) * gap, cy = 20 + Math.floor(i / perRow) * gap; b += ICONS[kind](cx, cy, r); }
    return svg(w, h, b);
  };
  // gruppi uguali (moltiplicazione come addizione ripetuta)
  V.groups = function (g, k, kind = 'pallina') {
    const per = Math.min(k, 5), rr = 9, gw = per * 22 + 16, rows = Math.ceil(k / 5), gh = rows * 22 + 16;
    const cols = Math.min(g, 4), w = cols * (gw + 10) + 10, h = Math.ceil(g / 4) * (gh + 10) + 10;
    let b = '';
    for (let i = 0; i < g; i++) {
      const gx = 10 + (i % 4) * (gw + 10), gy = 10 + Math.floor(i / 4) * (gh + 10);
      b += `<rect x="${gx}" y="${gy}" width="${gw}" height="${gh}" rx="12" fill="#eef4ff" stroke="#9db4e8" stroke-dasharray="4 3"/>`;
      for (let j = 0; j < k; j++) b += ICONS[kind](gx + 18 + (j % 5) * 22, gy + 19 + Math.floor(j / 5) * 22, rr);
    }
    return svg(w, h, b);
  };
  // schieramento righe × colonne
  V.array = function (r, c) {
    const s = 24, w = c * s + 20, h = r * s + 20;
    let b = '';
    for (let i = 0; i < r; i++) for (let j = 0; j < c; j++) b += `<circle cx="${20 + j * s}" cy="${20 + i * s}" r="8" fill="#7209b7" opacity=".85"/>`;
    return svg(w, h, b);
  };
  // blocchi in base 10: centinaia (quadrati), decine (barrette), unità (cubetti)
  V.base10 = function (h, d, u) {
    const s = 7; let x = 8, b = '';
    for (let i = 0; i < h; i++) { b += `<rect x="${x}" y="8" width="${10 * s}" height="${10 * s}" fill="#95d5b2" stroke="#2a9d5c"/>`; for (let k = 1; k < 10; k++) b += `<line x1="${x + k * s}" y1="8" x2="${x + k * s}" y2="${8 + 10 * s}" stroke="#2a9d5c" stroke-width=".5"/><line x1="${x}" y1="${8 + k * s}" x2="${x + 10 * s}" y2="${8 + k * s}" stroke="#2a9d5c" stroke-width=".5"/>`; x += 10 * s + 8; }
    for (let i = 0; i < d; i++) { b += `<rect x="${x}" y="8" width="${s}" height="${10 * s}" fill="#f4a3a8" stroke="#e63946"/>`; for (let k = 1; k < 10; k++) b += `<line x1="${x}" y1="${8 + k * s}" x2="${x + s}" y2="${8 + k * s}" stroke="#e63946" stroke-width=".5"/>`; x += s + 5; }
    if (d) x += 4;
    for (let i = 0; i < u; i++) { b += `<rect x="${x + (i % 3) * (s + 3)}" y="${8 + 10 * s - s - Math.floor(i / 3) * (s + 3)}" width="${s}" height="${s}" fill="#8ab8f5" stroke="#1d6fe0"/>`; }
    x += u ? 3 * (s + 3) + 4 : 0;
    return svg(Math.max(60, x + 4), 10 * s + 16, b);
  };
  // linea dei numeri con eventuali salti (frecce) e un punto da trovare
  V.numberLine = function (from, to, opts = {}) {
    const n = to - from, w = Math.min(680, Math.max(300, n * 34)), x0 = 20, step = (w - 40) / n;
    const X = v => x0 + (v - from) * step;
    let b = `<line x1="${x0 - 10}" y1="60" x2="${w - 10}" y2="60" stroke="#333" stroke-width="2"/><path d="M${w - 10} 60 l-8 -5 v10z" fill="#333"/>`;
    const lbEvery = opts.every || (n > 20 ? 5 : 1);
    for (let v = from; v <= to; v++) {
      const big = (v - from) % lbEvery === 0;
      b += `<line x1="${X(v)}" y1="${big ? 52 : 55}" x2="${X(v)}" y2="${big ? 68 : 65}" stroke="#333" stroke-width="${big ? 2 : 1}"/>`;
      if (big && !(opts.hide || []).includes(v)) b += T(X(v), 86, String(opts.label ? opts.label(v) : v), 13, '#333');
    }
    for (const [a, c] of (opts.jumps || [])) { const xa = X(a), xc = X(c), mid = (xa + xc) / 2, hgt = Math.min(40, Math.abs(xc - xa) / 2 + 10); b += `<path d="M${xa} 55 Q${mid} ${55 - hgt * 1.6} ${xc} 55" fill="none" stroke="#f3722c" stroke-width="2.5"/><path d="M${xc} 55 l${xc > xa ? -9 : 9} -6 l${xc > xa ? 2 : -2} 8z" fill="#f3722c"/>`; }
    for (const v of (opts.mark || [])) b += `<circle cx="${X(v)}" cy="60" r="7" fill="#e63946"/>`;
    for (const v of (opts.ask || [])) b += `<rect x="${X(v) - 13}" y="72" width="26" height="22" rx="5" fill="#fff3bf" stroke="#f59f00"/>` + T(X(v), 88, '?', 15, '#d9480f');
    return svg(w, 100, b);
  };
  // orologio analogico
  V.clock = function (h, m, big) {
    const c = 80, r = 70;
    let b = `<circle cx="${c}" cy="${c}" r="${r}" fill="#fff" stroke="#264653" stroke-width="5"/>`;
    for (let i = 0; i < 60; i++) { const a = i * Math.PI / 30, big = i % 5 === 0; b += `<line x1="${c + (r - (big ? 11 : 5)) * Math.sin(a)}" y1="${c - (r - (big ? 11 : 5)) * Math.cos(a)}" x2="${c + (r - 2) * Math.sin(a)}" y2="${c - (r - 2) * Math.cos(a)}" stroke="#264653" stroke-width="${big ? 2.5 : 1}"/>`; }
    for (let i = 1; i <= 12; i++) { const a = i * Math.PI / 6; b += T(c + (r - 22) * Math.sin(a), c - (r - 22) * Math.cos(a) + 5, String(i), 14, '#264653'); }
    const ah = ((h % 12) + m / 60) * Math.PI / 6, am = m * Math.PI / 30;
    b += `<line x1="${c}" y1="${c}" x2="${c + 38 * Math.sin(ah)}" y2="${c - 38 * Math.cos(ah)}" stroke="#264653" stroke-width="6" stroke-linecap="round"/>`;
    b += `<line x1="${c}" y1="${c}" x2="${c + 56 * Math.sin(am)}" y2="${c - 56 * Math.cos(am)}" stroke="#e76f51" stroke-width="4" stroke-linecap="round"/><circle cx="${c}" cy="${c}" r="5" fill="#264653"/>`;
    return big ? `<svg viewBox="0 0 160 160" width="240" height="240" class="vis" xmlns="http://www.w3.org/2000/svg">${b}</svg>` : svg(160, 160, b);
  };
  // monete e banconote in centesimi
  V.money = function (list) {
    const en = root.LANG === 'en';
    const lab = v => v >= 100 ? (en ? '€' + (v / 100) : (v / 100) + ' €') : v + (en ? 'c' : ' cent');
    // banconote: colori veri dell'euro; monete: rame (1, 2, 5 cent), oro nordico (10, 20, 50 cent), bimetalliche (1 € e 2 €)
    const NOTE = { 500: '#9fa8a3', 1000: '#e07a7a', 2000: '#6c9bd2', 5000: '#e9a05a', 10000: '#6fb36f', 20000: '#d8b93c', 50000: '#a98ac9' };
    let x = 6, b = '';
    for (const v of list) {
      if (v >= 500) { b += `<rect x="${x}" y="14" width="92" height="52" rx="5" fill="${NOTE[v] || '#999'}" stroke="#555"/><rect x="${x + 5}" y="19" width="82" height="42" rx="3" fill="none" stroke="#fff" stroke-opacity=".6"/>` + T(x + 46, 47, lab(v), 18, '#fff', 'middle', 900); x += 100; }
      else {
        const r = v === 200 ? 24 : v === 100 ? 22 : v >= 10 ? 20 : 17;
        if (v >= 100) {
          const outer = v === 200 ? '#c8ccd1' : '#e6c35c', inner = v === 200 ? '#e6c35c' : '#c8ccd1';
          b += `<circle cx="${x + r}" cy="40" r="${r}" fill="${outer}" stroke="#6b5a2a" stroke-width="2"/><circle cx="${x + r}" cy="40" r="${r - 7}" fill="${inner}" stroke="#6b5a2a" stroke-width="1"/>`;
        } else b += `<circle cx="${x + r}" cy="40" r="${r}" fill="${v >= 10 ? '#e6c35c' : '#c9783a'}" stroke="#8a6d1f" stroke-width="2"/>`;
        if (v >= 100) b += T(x + r, 45, lab(v), 13, '#2b1d00', 'middle', 900);
        else b += T(x + r, 42, String(v), v >= 10 ? 15 : 13, '#2b1d00', 'middle', 900) + T(x + r, 52, 'cent', 7, '#2b1d00', 'middle', 700);
        x += 2 * r + 6;
      }
    }
    return svg(Math.max(60, x + 4), 80, b);
  };
  // frazione: torta o barra con parti colorate
  V.fraction = function (n, d, kind = 'pie') {
    let b = '';
    if (kind === 'pie') {
      const c = 70, r = 60;
      for (let i = 0; i < d; i++) {
        const a0 = -Math.PI / 2 + i * 2 * Math.PI / d, a1 = a0 + 2 * Math.PI / d;
        const p = d === 1 ? `M${c} ${c - r} A${r} ${r} 0 1 1 ${c - 0.01} ${c - r}Z` : `M${c} ${c} L${c + r * Math.cos(a0)} ${c + r * Math.sin(a0)} A${r} ${r} 0 ${a1 - a0 > Math.PI ? 1 : 0} 1 ${c + r * Math.cos(a1)} ${c + r * Math.sin(a1)}Z`;
        b += `<path d="${p}" fill="${i < n ? '#f77f00' : '#fff'}" stroke="#333" stroke-width="2"/>`;
      }
      return svg(140, 140, b);
    }
    const w = 300, h = 46, pw = w / d;
    for (let i = 0; i < d; i++) b += `<rect x="${10 + i * pw}" y="10" width="${pw}" height="${h}" fill="${i < n ? '#2a9d8f' : '#fff'}" stroke="#333" stroke-width="2"/>`;
    return svg(w + 20, h + 20, b);
  };
  // poligono con le misure dei lati
  V.polygon = function (pts, labels = [], opts = {}) {
    const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
    const mnx = Math.min(...xs), mny = Math.min(...ys), mxx = Math.max(...xs), mxy = Math.max(...ys);
    const sc = Math.min(220 / Math.max(1, mxx - mnx), 150 / Math.max(1, mxy - mny));
    const P = pts.map(p => [40 + (p[0] - mnx) * sc, 30 + (mxy - p[1]) * sc]);
    let b = `<path d="M${P.map(p => p.join(' ')).join(' L')}Z" fill="${opts.fill || '#cdeccf'}" stroke="#2d6a4f" stroke-width="3"/>`;
    const cx = P.reduce((s, p) => s + p[0], 0) / P.length, cy = P.reduce((s, p) => s + p[1], 0) / P.length;
    labels.forEach((lb, i) => {
      if (lb === null || lb === undefined || lb === '') return;
      const a = P[i], c = P[(i + 1) % P.length]; const mx = (a[0] + c[0]) / 2, my = (a[1] + c[1]) / 2;
      const dx = mx - cx, dy = my - cy, l = Math.hypot(dx, dy) || 1;
      b += T(mx + dx / l * 18, my + dy / l * 18 + 5, lb, 14, '#1b4332');
    });
    if (opts.h) { const [a, c] = opts.h.map(p => [40 + (p[0] - mnx) * sc, 30 + (mxy - p[1]) * sc]); b += `<line x1="${a[0]}" y1="${a[1]}" x2="${c[0]}" y2="${c[1]}" stroke="#d00000" stroke-width="2" stroke-dasharray="5 4"/>` + T(c[0] + 8, (a[1] + c[1]) / 2 + 5, opts.hLabel || 'h', 14, '#d00000', 'start'); }
    return svg(Math.max(...P.map(p => p[0])) + 50, Math.max(...P.map(p => p[1])) + 40, b);
  };
  // figura su quadretti (aree e perimetri contando)
  V.gridShape = function (w, h) {
    const s = 22; let b = '';
    for (let i = 0; i <= w + 2; i++) b += `<line x1="${10 + i * s}" y1="10" x2="${10 + i * s}" y2="${10 + (h + 2) * s}" stroke="#d0d7de"/>`;
    for (let j = 0; j <= h + 2; j++) b += `<line x1="10" y1="${10 + j * s}" x2="${10 + (w + 2) * s}" y2="${10 + j * s}" stroke="#d0d7de"/>`;
    b += `<rect x="${10 + s}" y="${10 + s}" width="${w * s}" height="${h * s}" fill="#90e0ef" fill-opacity=".7" stroke="#0077b6" stroke-width="3"/>`;
    return svg((w + 2) * s + 20, (h + 2) * s + 20, b);
  };
  // figure piane semplici
  V.shape = function (name, color = '#ffafcc') {
    const st = `fill="${color}" stroke="#333" stroke-width="3"`;
    const S = {
      cerchio: `<circle cx="70" cy="60" r="48" ${st}/>`,
      quadrato: `<rect x="22" y="12" width="96" height="96" ${st}/>`,
      rettangolo: `<rect x="5" y="30" width="130" height="64" ${st}/>`,
      triangolo: `<path d="M70 10 L130 108 L10 108Z" ${st}/>`,
      rombo: `<path d="M70 6 L126 60 L70 114 L14 60Z" ${st}/>`,
      pentagono: `<path d="M70 8 L126 50 L104 112 L36 112 L14 50Z" ${st}/>`,
      esagono: `<path d="M40 12 L100 12 L130 60 L100 108 L40 108 L10 60Z" ${st}/>`,
      ovale: `<ellipse cx="70" cy="60" rx="62" ry="38" ${st}/>`,
      trapezio: `<path d="M40 20 L100 20 L132 104 L8 104Z" ${st}/>`,
    };
    return svg(140, 120, S[name]);
  };
  // angolo con l'ampiezza data (gradi)
  V.angle = function (deg, label = true) {
    const c = [40, 120], L = 110, a = deg * Math.PI / 180;
    const p = [c[0] + L * Math.cos(a), c[1] - L * Math.sin(a)];
    let b = `<line x1="${c[0]}" y1="${c[1]}" x2="${c[0] + L}" y2="${c[1]}" stroke="#333" stroke-width="3"/><line x1="${c[0]}" y1="${c[1]}" x2="${p[0]}" y2="${p[1]}" stroke="#333" stroke-width="3"/>`;
    if (Math.abs(deg - 90) < 0.01) b += `<path d="M${c[0] + 18} ${c[1]} V${c[1] - 18} H${c[0]}" fill="none" stroke="#e63946" stroke-width="2"/>`;
    else { const r = 26; b += `<path d="M${c[0] + r} ${c[1]} A${r} ${r} 0 ${deg > 180 ? 1 : 0} 0 ${c[0] + r * Math.cos(a)} ${c[1] - r * Math.sin(a)}" fill="none" stroke="#e63946" stroke-width="2"/>`; }
    const minx = Math.min(c[0], p[0]) - 10;
    return svg(Math.max(c[0] + L, p[0]) - minx + 20, 140, `<g transform="translate(${-minx + 10} 0)">${b}</g>`);
  };
  // coppie di rette
  // traslazione, rotazione o simmetria di una figura a forma di L sul reticolo (A = di partenza, B = di arrivo)
  V.transform = function (kind, o) {
    const c = 24, W = 13, H = 9, pad = 6;
    const L = [[0, 0], [1, 0], [1, 2], [2, 2], [2, 3], [0, 3]];
    const A = L.map(([x, y]) => [o.ax + x, o.ay + y]);
    let f, extra = '';
    if (kind === 'trasl') f = ([x, y]) => [x + o.dx, y + o.dy];
    else if (kind === 'rot') { const P = [o.ax + 4, o.ay + 1]; f = ([x, y]) => [P[0] - (y - P[1]), P[1] + (x - P[0])]; extra = `<circle cx="${pad + P[0] * c}" cy="${pad + P[1] * c}" r="5" fill="#d00000"/>`; }
    else { const ax = o.ax + 3; f = ([x, y]) => [2 * ax - x, y]; extra = `<line x1="${pad + ax * c}" y1="${pad}" x2="${pad + ax * c}" y2="${pad + H * c}" stroke="#d00000" stroke-width="3" stroke-dasharray="8 6"/>`; }
    const B = A.map(f);
    const inA = [o.ax + 0.5, o.ay + 1.5], inB = f(inA); // un punto dentro la figura, per la lettera
    let g = '';
    for (let x = 0; x <= W; x++) g += `<line x1="${pad + x * c}" y1="${pad}" x2="${pad + x * c}" y2="${pad + H * c}" stroke="#dde3f0"/>`;

          el('div', { class: 'dot' }, open ? String(i + 1) : '🔒'), el('div', { class: 'lt' }, l.title), el('div', { class: 'stars', html: [0, 1, 2].map(k => k < st ? '<b>★</b>' : '★').join('') })));
      });

        el('div', { class: 'dot' }, vOpen ? '🏆' : '🔒'), el('div', { class: 'lt' }, t('Verifica finale', 'Final test')), el('div', { class: 'vg' }, best !== undefined ? GIUDIZI(best).short : '')));

  }
  // giudizi della scuola primaria (O.M. 172/2020)
  function GIUDIZI(pct) {

  const VN = 10; // domande della verifica

      el('div', { class: 'how', html: t('📝 Durante la verifica non ci sono aiuti: rispondi con calma. <br>✏️ Tieni pronto il quaderno: i calcoli falli a mano, in colonna, e scrivi qui solo il risultato. <br>Alla fine vedrai il risultato e la spiegazione di ogni errore.', '📝 There are no hints during the test: take your time. <br>✏️ Keep your exercise book ready: do the calculations by hand, in columns, and type just the answer here. <br>At the end you will see your result and an explanation of every mistake.') }),

  function playVerif(w, m) {
    const qs = [], seen = new Set();

    const lv = m.levels.slice().sort(() => Math.random() - 0.5);
    for (let i = 0; i < VN; i++) order.push(lv[i % lv.length]);
    for (const l of order) {
      let q, g = 0;
      do { q = l.gen(); g++; } while (seen.has(q.t + (q.v || '').length) && g < 30);
      seen.add(q.t + (q.v || '').length);

    cur = { w, m, l: { id: 'verifica', title: t('Verifica: ', 'Test: ') + m.title, theory: '' }, qs, i: 0, res: [], coins: 0, verif: true, wrong: [] };

  /* ---------------- livello: spiegazione e gioco ---------------- */

  let cur = null; // partita in corso
  // chiave di una domanda (per non ripetere le stesse quando si rigioca)
  const qkey = q => q.t + '|' + (q.v || '').length + '|' + (q.o || []).join(',');
  function play(w, m, l) {
    const p = me();
    p.recent = p.recent || {};
    const rk = lkey(w.n, m.id, l.id);
    const recent = new Set(p.recent[rk] || []);
    const qs = [], seen = new Set();
    // domande sempre nuove: si scartano quelle delle partite precedenti (finché è possibile)
    for (let g = 0; qs.length < QN && g < 400; g++) {
      const q = l.gen(), k = qkey(q);
      if (seen.has(k) && g < 300) continue;
      if (recent.has(k) && g < 250) continue;
      seen.add(k); qs.push(q);
    }
    p.recent[rk] = [...(p.recent[rk] || []), ...qs.map(qkey)].slice(-60);
    save();
    // i minigiochi cambiano a ogni partita: si parte da un punto diverso della rotazione
    p.spin = ((p.spin || 0) + 1) % 997;
    qs.forEach((q, i) => { q._style = (p.spin + i) % 3; if (q.k === 'num' && Number.isInteger(q.a) && (p.spin + i) % 3 === 2) toChoice(q); });
    cur = { w, m, l, qs, i: 0, res: [], coins: 0 };

  }
  // una domanda numerica diventa a scelta (minigioco diverso), con risposte vicine come distrattori
  function toChoice(q) {
    const a = q.a, opts = new Set([a]);
    const spread = Math.max(2, Math.round(Math.abs(a) * 0.15));
    let g = 0;
    while (opts.size < 4 && g++ < 60) { const d = Math.floor(Math.random() * (2 * spread + 1)) - spread; const v = a + (d || 1); if (v >= 0 || a < 0) opts.add(v); }
    if (a % 10 === 0 && a >= 10) opts.add(a + 1);
    const arr = [...opts].slice(0, 4).sort(() => Math.random() - 0.5);
    q.k = 'choice'; q.o = arr.map(v => M.unitFmt(M.F(v), q.unit && q.unit.length <= 3 ? q.unit : '')); q.a = arr.indexOf(a); q._fromNum = true;
  }
  function progressBar() {

    const s = screen();

    const card = el('div', { class: 'qcard' });
    const st = q._style || 0;
    const kind = q.k === 'choice' ? ['palloncini', 'pesci', 'carte'][st] : q.k === 'cmp' ? 'coccodrillo' : 'forziere';
    card.append(el('div', { class: 'mg-title' }, (EN ? { palloncini: '🎈 Pop the right balloon', pesci: '🎣 Catch the right fish', carte: '🃏 Turn over the right card', coccodrillo: '🐊 Help the crocodile', forziere: '🧰 Open the treasure chest with the right answer' } : { palloncini: '🎈 Scoppia il palloncino giusto', pesci: '🎣 Pesca il pesce giusto', carte: '🃏 Gira la carta giusta', coccodrillo: '🐊 Aiuta il coccodrillo', forziere: '🧰 Apri il forziere con la risposta giusta' })[kind]));
    card.append(el('div', { class: 'qtext', html: q.t }));

  // palloncini: si tocca quello con la risposta giusta
  // tre minigiochi a scelta: palloncini, pesci che nuotano, carte da girare
  function balloons(area, q, kind = 'palloncini') {
    const wrap = el('div', { class: 'balloons mg-' + kind });
    q.o.forEach((o, i) => {
      const b = el('button', { class: 'balloon', type: 'button', 'aria-label': o, onclick: () => { if (cur.locked) return; b.classList.add(kind === 'carte' ? 'flip' : 'pop'); answer(q, i, () => wrap.querySelectorAll('.balloon').forEach((x, j) => { if (j === q.a) x.classList.add('good'); })); } },
        el('div', { class: 'b', style: `background:${BALLOON_COL[i % BALLOON_COL.length]}` }, /\d/.test(o) ? el('span', { class: 'lab' }, o) : o), kind === 'palloncini' ? el('div', { class: 's' }) : null);

  // coccodrillo: <, >, =

    const wrap = el('div', { class: 'crocs' });

  // forziere: uno o più campi numerici con il tastierino
  function chest(area, q) {

    const press = k => {
      if (cur.locked) return;
      if (k === 'ok') { if (vals.some(v => !v)) { toast(vals.length > 1 ? t('Completa tutte le caselle', 'Fill in all the boxes') : t('Scrivi la risposta', 'Type your answer')); return; } submit(); return; }
      if (k === 'del') vals[focus] = vals[focus].slice(0, -1);
      else if (k === '±') vals[focus] = vals[focus].startsWith('-') ? vals[focus].slice(1) : '-' + vals[focus];
      else if (k === 'dp') { if (!vals[focus].includes(DP)) vals[focus] = (vals[focus] || '0') + DP; }
      else if (vals[focus].replace(/[-,.]/g, '').length < 9) { vals[focus] += k; if (q.fr === undefined && fields.length > 1 && false) focus++; }

    };
    const submit = () => {
      const given = q.k === 'multi' ? vals.slice() : vals[0];

    pad.append(el('button', { type: 'button', class: 'k-del', 'aria-label': t('Cancella', 'Delete'), onclick: () => press('del') }, '⌫'));
    pad.append(el('button', { type: 'button', onclick: () => press('0') }, '0'));
    pad.append(needDec ? el('button', { type: 'button', 'aria-label': t('virgola', 'decimal point'), onclick: () => press('dp') }, DP) : needNeg ? el('button', { type: 'button', 'aria-label': t('più o meno', 'plus or minus'), onclick: () => press('±') }, '±') : el('button', { type: 'button', class: 'k-ok', 'aria-label': t('Conferma', 'Confirm'), onclick: () => press('ok') }, '✔'));

    if (needDec || needNeg) pad.append(el('button', { type: 'button', class: 'k-ok', style: 'grid-column: span ' + (needDec && needNeg ? 2 : 3), onclick: () => press('ok') }, t('✔ Apri il forziere', '✔ Open the chest')));

  // risposta: giusta → festa e avanti; sbagliata → spiegazione
  function answer(q, given, mark) {

    cur.locked = true; cur.keyHandler = null;
    const ok = M.check(q, given);
    if (mark) mark(ok);
    cur.res.push(ok);
    if (ok) cur.coins++;
    beep(ok ? 'ok' : 'no');
    const card = document.querySelector('.qcard');
    const fb = el('div', { class: 'feedback ' + (ok ? 'ok' : 'no') });
    const next = () => { cur.i++; cur.locked = false; nextQ(); };

      fb.append(el('div', { class: 'fh' }, ok ? t('Risposta giusta ✔', 'Correct ✔') : t('Risposta sbagliata ✘', 'Wrong ✘')), el('div', { class: 'note', style: 'text-align:left' }, t('La spiegazione la vedrai alla fine della verifica.', 'You will see the explanation at the end of the test.')));
      fb.append(el('div', { class: 'row' }, el('button', { class: 'btn', type: 'button', onclick: next }, cur.i + 1 < cur.qs.length ? t('Prossima domanda ▶', 'Next question ▶') : t('Vedi il risultato ▶', 'See your result ▶'))));
    } else if (ok) {
      fb.append(el('div', { class: 'fh' }, (EN ? ['Brilliant! 🎉', 'Exactly! ⭐', 'Correct! 👏', 'Perfect! 🚀'] : ['Bravissimo! 🎉', 'Esatto! ⭐', 'Giusto! 👏', 'Perfetto! 🚀'])[Math.floor(Math.random() * 4)]), el('div', { html: q.x || '' }));
      if (calcOf(q)) fb.append(stepsButton(calcOf(q), t('👣 Rivedi i passaggi', '👣 Go over the steps')));
      fb.append(el('div', { class: 'row' }, el('button', { class: 'btn ok', type: 'button', onclick: next }, t('Avanti ▶', 'Next ▶'))));
    } else {
      fb.append(el('div', { class: 'fh' }, t('Quasi! Vediamo insieme 🤔', 'Nearly! Let\'s look at it together 🤔')));
      fb.append(el('div', {}, t('La risposta giusta è ', 'The right answer is '), el('span', { class: 'ans' }, M.answerText(q)), '.'));
      fb.append(el('div', { style: 'margin-top:6px', html: t('<b>Perché:</b> ', '<b>Why:</b> ') + (q.x || '') }));
      fb.append(el('div', { class: 'how', html: '💡 ' + cur.l.theory }));
      if (calcOf(q)) { const v = stepsViewer(calcOf(q)); if (v) { fb.append(v); stepsOpen = v; } }
      fb.append(el('div', { class: 'row' }, el('button', { class: 'btn', type: 'button', onclick: next }, t('Ho capito, avanti ▶', 'Got it, next ▶'))));

    setTimeout(() => { const b = fb.querySelector('button'); if (b) b.focus({ preventScroll: true }); }, 30);
  }

  function finish() {
    if (cur.verif) return finishVerif();
    const { w, m, l } = cur;
    const right = cur.res.filter(Boolean).length, n = cur.res.length;
    const stars = right === n ? 3 : right >= Math.ceil(n * 0.75) ? 2 : right >= Math.ceil(n / 2) ? 1 : 0;
    const p = me();
    const k = lkey(w.n, m.id, l.id);
    const prev = starsOf(p, k);
    if (stars > prev) p.stars[k] = stars;
    p.coins += cur.coins;
    save();
    setTop(`${m.icon} ${l.title}`, () => showWorld(w));
    const s = screen();
    const idx = m.levels.indexOf(l), nxt = m.levels[idx + 1];
    const box = el('div', { class: 'result' },
      el('div', { class: 'bigstars', html: [0, 1, 2].map(i => i < stars ? '<b>★</b>' : '★').join('') }),
      el('h1', {}, stars === 3 ? t('Fantastico!', 'Fantastic!') : stars === 2 ? t('Molto bene!', 'Very good!') : stars === 1 ? t('Bene, livello superato!', 'Well done, level passed!') : t('Ci riproviamo?', 'Shall we try again?')),
      el('p', { style: 'font-size:20px' }, t(`Hai risposto giusto a ${right} domande su ${n}.`, `You got ${right} out of ${n} questions right.`)),
      el('p', { style: 'font-size:20px' }, t(`Hai guadagnato 🪙 ${cur.coins} monete.`, `You earned 🪙 ${cur.coins} coin${cur.coins === 1 ? '' : 's'}.`)),
      stars === 0 ? el('p', { class: 'note' }, t('Per sbloccare il livello successivo servono almeno metà risposte giuste. Rileggi «Come si fa» e riprova!', 'To unlock the next level you need at least half of the answers right. Read “How to do it” again and have another go!')) : null,
      factCard(m.id),
      el('div', { class: 'row' },
        el('button', { class: 'btn alt', type: 'button', onclick: () => showWorld(w) }, t('🗺️ Mappa', '🗺️ Map')),
        el('button', { class: 'btn alt', type: 'button', onclick: () => play(w, m, l) }, t('🔁 Rigioca', '🔁 Play again')),
        nxt && (stars > 0 || D.teacher) ? el('button', { class: 'btn ok', type: 'button', onclick: () => showIntro(w, m, nxt) }, t('Livello successivo ▶', 'Next level ▶')) : null));
    s.append(box);
    if (stars > 0) { beep('win'); confetti(); }
  }
  function finishVerif() {
    const { w, m } = cur;
    const right = cur.res.filter(Boolean).length, n = cur.res.length, pct = Math.round(right * 100 / n);
    const g = GIUDIZI(pct);
    const p = me();
    p.verif = p.verif || {};
    const k = lkey(w.n, m.id, 'verifica');
    if (p.verif[k] === undefined || pct > p.verif[k]) p.verif[k] = pct;
    p.coins += cur.coins + (pct >= 90 ? 5 : 0);
    save();
    setTop(`${m.icon} ${t('Verifica', 'Test')}: ${m.title}`, () => showWorld(w));
    const s = screen();
    const box = el('div', { class: 'result' },
      el('div', { style: 'font-size:64px' }, pct >= 90 ? '🏆' : pct >= 60 ? '🎖️' : '💪'),
      el('h1', {}, t(`Verifica: ${right} su ${n}`, `Test: ${right} out of ${n}`)),
      el('div', { class: 'giudizio', style: `background:${g.col}` }, g.text),
      el('p', { style: 'font-size:18px' }, t(`Hai guadagnato 🪙 ${cur.coins + (pct >= 90 ? 5 : 0)} monete${pct >= 90 ? ' (5 di premio!)' : ''}.`, `You earned 🪙 ${cur.coins + (pct >= 90 ? 5 : 0)} coin${cur.coins + (pct >= 90 ? 5 : 0) === 1 ? '' : 's'}${pct >= 90 ? ' (including a 5-coin bonus!)' : ''}.`)));
    if (cur.wrong.length) {
      const list = el('div', { class: 'review' }, el('h2', { style: 'margin:6px 0 8px' }, t('Rivediamo gli errori', 'Let\'s go over the mistakes')));
      for (const { q, given } of cur.wrong) {
        const g2 = Array.isArray(given) ? given.join(' / ') : q.k === 'choice' ? q.o[given] : String(given);
        list.append(el('div', { class: 'rv' },
          el('div', { class: 'rv-l' }, q._ltitle || ''),
          el('div', { class: 'rv-q', html: q.t }),
          q.v ? el('div', { class: 'qvis', html: q.v }) : null,
          q.calcHide ? null : columnView(q.calc),
          el('div', {}, t('Hai risposto ', 'You answered '), el('span', { class: 'ans no' }, g2 || '—'), t(' · giusta: ', ' · right answer: '), el('span', { class: 'ans' }, M.answerText(q))),
          el('div', { style: 'margin-top:4px', html: t('<b>Perché:</b> ', '<b>Why:</b> ') + (q.x || '') }),
          el('div', { class: 'how', html: '💡 ' + (q._theory || '') }),
          calcOf(q) ? stepsButton(calcOf(q)) : null));
      }
      box.append(list);
    } else box.append(el('p', { style: 'font-size:20px' }, t('Nessun errore: complimenti! 🎉', 'No mistakes: well done! 🎉')));
    box.append(factCard(m.id));
    box.append(el('div', { class: 'row' },
      el('button', { class: 'btn alt', type: 'button', onclick: () => showWorld(w) }, t('🗺️ Mappa', '🗺️ Map')),
      el('button', { class: 'btn', type: 'button', onclick: () => playVerif(w, m) }, t('🔁 Rifai la verifica', '🔁 Take the test again'))));
    deco(box);
    s.append(box);
    if (pct >= 60) { beep('win'); confetti(); }
  }
  // «Lo sai che…?» tra un livello e l'altro (senza ripetere quelle già viste dal giocatore)
  function factCard(modId) {
    if (!window.Facts) return null;
    const p = me();
    p.seenFacts = p.seenFacts || [];
    const f = window.Facts.pickFact(modId, p.seenFacts);
    p.seenFacts.push(f.i);
    if (p.seenFacts.length >= window.Facts.FACTS.length) p.seenFacts = [f.i];
    save();
    return el('div', { class: 'fact' }, el('div', { class: 'fi' }, f.icon), el('div', {}, el('div', { class: 'ft' }, t('Lo sai che…?', 'Did you know…?')), el('div', { class: 'fx' }, f.text)));
  }
  function confetti() {
    const c = el('div', { class: 'confetti' });
    for (let i = 0; i < 70; i++) c.append(el('i', { style: `left:${Math.random() * 100}%;background:${BALLOON_COL[i % 6]};animation-delay:${Math.random() * 0.8}s;animation-duration:${1.6 + Math.random() * 1.4}s` }));
    document.body.append(c); setTimeout(() => c.remove(), 3500);
  }

  /* ---------------- impostazioni (per l'insegnante) ---------------- */
  function settings() {
    const chk = el('input', { type: 'checkbox' }); chk.checked = D.teacher;
    const m = modal([el('h2', { style: 'margin-top:0' }, t('Impostazioni', 'Settings')),
      el('label', { style: 'display:flex;gap:10px;align-items:center;font-size:18px;font-weight:700' }, chk, t('Modalità insegnante: tutti i livelli sbloccati', 'Teacher mode: all levels unlocked')),
      el('p', { class: 'note', style: 'text-align:left' }, t('Utile per scegliere subito l\'argomento della lezione alla LIM o per ripassare.', 'Useful for going straight to the topic of the lesson on the interactive whiteboard, or for revision.')),
      el('div', { class: 'row' }, el('button', { class: 'btn', type: 'button', onclick: () => { D.teacher = chk.checked; save(); m.remove(); if (me()) showWorlds(); } }, t('Fatto', 'Done')))]);
  }

  document.addEventListener('keydown', e => {
    if (e.target.closest && e.target.closest('input, textarea')) return;
    if (stepsOpen && document.body.contains(stepsOpen) && stepsOpen._key(e)) { e.preventDefault(); return; }
    if (cur && cur.keyHandler && document.querySelector('.qcard')) cur.keyHandler(e);
  });
  if (EN) { document.documentElement.lang = 'en'; $('#tBack').setAttribute('aria-label', 'Back'); $('#tPlayer').title = 'Change player'; $('#tSound').setAttribute('aria-label', 'Sound'); $('#tSet').setAttribute('aria-label', 'Settings'); }
  // la moneta 🪙 è un'emoji recente che su alcuni tablet non si vede: la disegniamo noi
  const COIN = '\u{1FA99}';
  function coinify(node) {
    const tw = document.createTreeWalker(node, NodeFilter.SHOW_TEXT, { acceptNode: n => n.nodeValue.includes(COIN) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT });
    const list = []; while (tw.nextNode()) list.push(tw.currentNode);
    for (const n of list) {
      const parts = n.nodeValue.split(COIN), frag = document.createDocumentFragment();
      parts.forEach((p, i) => { if (i) frag.append(el('span', { class: 'coin', role: 'img', 'aria-label': t('monete', 'coins') })); if (p) frag.append(p); });
      n.replaceWith(frag);
    }
  }
  new MutationObserver(ms => { for (const m of ms) { if (m.type === 'characterData' && m.target.nodeValue.includes(COIN)) coinify(m.target.parentNode); for (const a of m.addedNodes) if (a.nodeType === 1 || a.nodeType === 3) coinify(a.nodeType === 3 ? a.parentNode || document.body : a); } }).observe(document.body, { childList: true, subtree: true, characterData: true });
  // app installabile (PWA): solo sul sito, non nei file aperti dal computer
  if (window.PWA && 'serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    navigator.serviceWorker.register('sw.js').catch(() => { /* senza modalità offline */ });
    let deferred = null;
    const ib = $('#tInstall');
    ib.innerHTML = '📲<span class="lbl"> ' + t('Installa', 'Install') + '</span>'; ib.title = t('Installa il gioco come app', 'Install the game as an app');
    // il pulsante è sempre visibile (tranne quando il gioco è già aperto come app): se Chrome permette
    // l'installazione diretta la avvia, altrimenti spiega come fare su quel dispositivo
    const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
    ib.hidden = standalone;
    window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferred = e; ib.hidden = false; });
    function howTo() {
      const ua = navigator.userAgent;
      const ios = /iPad|iPhone|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
      const android = /Android/.test(ua), samsung = /SamsungBrowser/.test(ua), firefox = /Firefox|FxiOS/.test(ua);
      let steps;
      if (ios) steps = [t('Apri questa pagina con <b>Safari</b> (o Chrome).', 'Open this page in <b>Safari</b> (or Chrome).'),
        t('Tocca il pulsante <b>Condividi</b> <span style="font-size:22px">⬆️</span> (in alto o in basso, a seconda del modello).', 'Tap the <b>Share</b> button <span style="font-size:22px">⬆️</span> (at the top or the bottom, depending on the device).'),
        t('Scorri e scegli <b>«Aggiungi a Home»</b>, poi <b>Aggiungi</b>.', 'Scroll down and choose <b>“Add to Home Screen”</b>, then <b>Add</b>.')];
      else if (samsung) steps = [t('Tocca il menu <b>☰</b> in basso.', 'Tap the <b>☰</b> menu at the bottom.'), t('Scegli <b>«Aggiungi pagina a» → «Schermata Home»</b>.', 'Choose <b>“Add page to” → “Home screen”</b>.')];
      else if (android) steps = [t('Apri questa pagina con <b>Chrome</b>.', 'Open this page in <b>Chrome</b>.'), t('Tocca il menu <b>⋮</b> in alto a destra.', 'Tap the <b>⋮</b> menu at the top right.'),
        t('Scegli <b>«Installa app»</b> oppure <b>«Aggiungi a schermata Home» → Installa</b>.', 'Choose <b>“Install app”</b> or <b>“Add to Home screen” → Install</b>.')];
      else if (firefox) steps = [t('Firefox per computer non installa le app web: apri questa pagina con <b>Chrome</b> o <b>Edge</b>.', 'Firefox on computers cannot install web apps: open this page in <b>Chrome</b> or <b>Edge</b>.')];
      else steps = [t('Usa <b>Chrome</b> o <b>Edge</b>.', 'Use <b>Chrome</b> or <b>Edge</b>.'), t('Clicca l\'icona di installazione <b>⊕</b> a destra nella barra degli indirizzi, oppure menu <b>⋮</b> → <b>«Trasmetti, salva e condividi» → «Installa pagina come app»</b>.', 'Click the install icon <b>⊕</b> on the right of the address bar, or menu <b>⋮</b> → <b>“Cast, save and share” → “Install page as app”</b>.')];
      const m = modal([el('h2', { style: 'margin-top:0' }, t('📲 Installa il gioco come app', '📲 Install the game as an app')),
        el('ol', { class: 'inst-steps' }, steps.map(h => el('li', { html: h }))),
        el('p', { class: 'note', style: 'text-align:left' }, t('Poi trovi l\'icona del gioco insieme alle altre app. Funziona anche senza internet e si aggiorna da solo.', 'You will then find the game\'s icon with your other apps. It works offline too and updates itself.')),
        el('div', { class: 'row' }, el('button', { class: 'btn', onclick: () => m.remove() }, t('Ho capito', 'Got it')))]);
    }
    ib.addEventListener('click', async () => { if (!deferred) return howTo(); const d = deferred; deferred = null; d.prompt(); try { const c = await d.userChoice; if (c && c.outcome === 'accepted') ib.hidden = true; } catch (err) { /* annullato */ } });
    window.addEventListener('appinstalled', () => { ib.hidden = true; toast(t('Il gioco è installato: lo trovi tra le tue app!', 'The game is installed: you\'ll find it with your apps!')); });
  }
  $('#tSound').addEventListener('click', () => { D.sound = !D.sound; save(); $('#tSound').textContent = D.sound ? '🔊' : '🔇'; });
  $('#tSet').addEventListener('click', settings);
  $('#tPlayer').addEventListener('click', showPlayers);
  window.__mate = { D, showWorlds, play: (w, m, l) => play(M.worlds[w - 1], M.worlds[w - 1].modules.find(x => x.id === m), M.worlds[w - 1].modules.find(x => x.id === m).levels.find(x => x.id === l)), cur: () => cur, verif: (w, m) => playVerif(M.worlds[w - 1], M.worlds[w - 1].modules.find(x => x.id === m)) };
  if (me()) showWorlds(); else showPlayers();
})();
</script>
</body></html>
